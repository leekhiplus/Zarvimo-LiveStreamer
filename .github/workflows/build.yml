name: Build ZVLS APK

on:
  push:
    branches: [main, master]
    paths:
      - "app-source*.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project (no manual extraction needed)
        run: |
          ZIP=$(ls -t app-source*.zip 2>/dev/null | head -n 1)
          [ -n "$ZIP" ] || { echo "No app-source*.zip found in the repo root"; exit 1; }
          echo "Using project zip: $ZIP"
          rm -rf project && mkdir project
          unzip -q "$ZIP" -d project
          SETTINGS=$(find project -maxdepth 3 -name settings.gradle.kts | head -n 1)
          [ -n "$SETTINGS" ] || { echo "settings.gradle.kts not found inside the zip"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" | head -n 1)
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/zvls-release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            PASS="$KEYSTORE_PASSWORD"; ALIAS="$KEY_ALIAS"; KPASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            echo "Using the keystore from repository secrets"
          else
            PASS="zvls-temp-pass"; ALIAS="zvls"; KPASS="$PASS"
            keytool -genkeypair -v -keystore "$KS" -storepass "$PASS" -keypass "$KPASS" \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Zarvimo ZVLS, O=Zarvimo, C=PK"
            echo "::warning::No keystore secrets found. A temporary key was generated, so a new build will not install over an older one. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets."
          fi
          {
            echo "KEYSTORE_PATH=$KS"
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEY_PASSWORD=$KPASS"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Print RootEncoder API (debug, runs only if the build fails)
        if: failure()
        run: |
          mkdir -p /tmp/re && cd /tmp/re
          LIB=$(find "$HOME/.gradle/caches/modules-2" -name "library-2.4.7.aar" | head -n 1)
          ENC=$(find "$HOME/.gradle/caches/modules-2" -name "encoder-2.4.7.aar" | head -n 1)
          [ -n "$LIB" ] && unzip -oq "$LIB" classes.jar -d lib
          [ -n "$ENC" ] && unzip -oq "$ENC" classes.jar -d enc
          CP=$(ls lib/classes.jar enc/classes.jar 2>/dev/null | paste -sd: -)
          javap -public -cp "$CP" com.pedro.library.base.FromFileBase com.pedro.library.rtmp.RtmpFromFile com.pedro.encoder.input.decoder.VideoDecoderInterface com.pedro.encoder.input.decoder.AudioDecoderInterface || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Collect APK
        run: |
          mkdir -p dist
          cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" "dist/ZVLS-v1.0.${{ github.run_number }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZVLS-apk
          path: dist/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Zarvimo Live Streamer v1.0.${{ github.run_number }}
          files: dist/*.apk
          generate_release_notes: true
